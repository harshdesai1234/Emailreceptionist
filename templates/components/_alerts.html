{% if messages %}
<div style="margin-bottom: 16px;">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-radius:8px;margin-bottom:8px;font-size:13px;background:{% if message.tags == 'error' or message.tags == 'danger' %}#fef2f2;border:1px solid #fecaca;color:#991b1b;{% elif message.tags == 'success' %}#f0fdf4;border:1px solid #bbf7d0;color:#166534;{% elif message.tags == 'warning' %}#fffbeb;border:1px solid #fde68a;color:#92400e;{% else %}#eff6ff;border:1px solid #bfdbfe;color:#1e40af;{% endif %}">
    <div style="display:flex;align-items:center;gap:8px;">
      {% if message.tags == 'success' %}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      {% elif message.tags == 'error' or message.tags == 'danger' %}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      {% elif message.tags == 'warning' %}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      {% else %}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      {% endif %}
      <span>{{ message }}</span>
    </div>
    <button type="button" onclick="this.parentElement.style.display='none'" style="background:none;border:none;font-size:18px;line-height:1;cursor:pointer;color:inherit;opacity:0.6;">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
